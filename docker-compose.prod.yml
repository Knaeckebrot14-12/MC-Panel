# Production stack used by install.sh. All values come from the .env file next to this
# file, which the installer writes. Run it through the `mc-panel` command or with:
#   docker compose -f docker-compose.prod.yml up -d
name: ${COMPOSE_PROJECT_NAME:-mcpanel}

services:
  database:
    image: mariadb:11
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, is the .env file missing?}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is not set}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  cache:
    image: redis:alpine
    restart: unless-stopped

  panel:
    build: .
    image: mcpanel-panel:latest
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - panel_var:/app/var/
      - panel_nginx:/etc/nginx/http.d/
      - panel_certs:/etc/letsencrypt/
      - panel_logs:/app/storage/logs
      # Shared with the updater service: update requests go in, progress comes back.
      - ${INSTALL_DIR:-.}/state:/app/updater
    environment:
      APP_URL: ${APP_URL:-http://localhost}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      APP_SERVICE_AUTHOR: ${APP_SERVICE_AUTHOR:-noreply@example.com}
      APP_ENV: production
      APP_ENVIRONMENT_ONLY: "false"
      # Off by default so the first login works; enable with your own keys under Settings -> Advanced.
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-false}
      LE_EMAIL: ${LE_EMAIL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: cache
      DB_HOST: database
      DB_PORT: "3306"
      DB_PASSWORD: ${DB_PASSWORD}
      HASHIDS_LENGTH: 8
      MC_PANEL_REPO: ${MC_PANEL_REPO:-Knaeckebrot14-12/MC-Panel}
      MC_PANEL_BRANCH: ${MC_PANEL_BRANCH:-main}
      MC_UPDATER_DIR: /app/updater

  # Applies updates for the panel: watches ./state for requests from the panel's
  # Settings -> Updates page, then pulls the repository, rebuilds and restarts the panel.
  updater:
    build: ./installer/updater
    image: mcpanel-updater:latest
    restart: unless-stopped
    working_dir: ${INSTALL_DIR:-/opt/mc-panel}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted at the same path as on the host so compose resolves paths identically.
      - ${INSTALL_DIR:-/opt/mc-panel}:${INSTALL_DIR:-/opt/mc-panel}
    environment:
      INSTALL_DIR: ${INSTALL_DIR:-/opt/mc-panel}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mcpanel}
      MC_PANEL_BRANCH: ${MC_PANEL_BRANCH:-main}
    command: ["bash", "${INSTALL_DIR:-/opt/mc-panel}/installer/updater/updater.sh", "daemon"]

volumes:
  db_data:
  panel_var:
  panel_nginx:
  panel_certs:
  panel_logs:
