# Security headers for every panel site. Included in each server block of panel.conf (the
# entrypoint adds the include to existing configs), so it also reaches installations whose
# nginx config was written by an older version.
server_tokens off;
fastcgi_hide_header X-Powered-By;
# The panel sets some of these itself; one value each (from here), since browsers ignore
# conflicting duplicates like "X-Frame-Options: DENY, SAMEORIGIN".
fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header X-Content-Type-Options;
fastcgi_hide_header Referrer-Policy;
fastcgi_hide_header X-XSS-Protection;

# phpMyAdmin (/phpmyadmin/, see .github/docker/phpmyadmin) never sends its addresses as referrer.
set $recoded_referrer_policy "strict-origin-when-cross-origin";
if ($uri ~ ^/phpmyadmin/) {
    set $recoded_referrer_policy "no-referrer";
}

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy $recoded_referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
add_header X-Robots-Tag "noindex, nofollow" always;

# phpMyAdmin: only its entry scripts, scripts, styles and images are reachable. Its libraries,
# templates, translations and configuration stay internal (regex locations listed here come
# before the PHP location of panel.conf, so they win).
location ~ ^/phpmyadmin/(libraries|templates|locale|vendor|sql|tmp|setup|doc|examples|test)(/|$) {
    deny all;
}
location ~ ^/phpmyadmin/(?!(index|url|signon|js/messages)\.php$).*\.php$ {
    deny all;
}
location ~ ^/phpmyadmin/.*\.(inc|md|json|lock|twig|txt|mo|po|sql|sh|yml|yaml|xml|dist)$ {
    deny all;
}
